# Live evals against the running app. Needs: npm run dev, SUPABASE_* set and the KB seeded (npm run seed:kb).
#   export OPENAI_API_KEY=...
#   npx promptfoo eval -c evals/promptfooconfig.openai.yaml
# The cases and assertions are shared (cases.yaml, default-test.yaml) so every provider is scored the same way.
description: Resolve ticket-resolution agent (resolve-gpt-5-mini)

providers:
  - id: http://localhost:3000/api/resolve
    label: resolve-gpt-5-mini
    config:
      method: POST
      headers:
        content-type: application/json
        x-api-key: "{{ env.OPENAI_API_KEY }}"
      body:
        provider: openai
        model: gpt-5-mini
        messages:
          - role: user
            content: "{{ ticket }}"
      transformResponse: file://transform.js

defaultTest: file://default-test.yaml
tests: file://cases.yaml
